name: Site

# Builds the static site from site-src and validates it. Pull requests run
# build + validate only, making validate_site.py a merge gate. Pushes to
# main additionally publish to GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      # Full history. Page dates are derived from each content file's commit
      # history, and a shallow clone reports the tip commit for every file —
      # wrong rather than missing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site-src/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r site-src/requirements.txt

      - name: Build site
        run: python site-src/build_site.py

      - name: Validate
        run: python site-src/validate_site.py

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
